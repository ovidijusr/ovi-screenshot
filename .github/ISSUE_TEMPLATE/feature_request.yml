name: Feature request
description: Suggest a focused improvement to the screenshot workflow.
title: 'Feature: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what you would expect to happen in the app.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional workarounds, related workflows, or references. Use nonprivate examples.
